{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block crumb %}{{ code }}{% endblock %}

{% block content %}
<div class="card" style="max-width:560px;margin-top:2rem">
  <div class="eyebrow">Error {{ code }}</div>
  <h1 style="margin:.3rem 0 .5rem">{{ title }}</h1>
  <p class="sub">{{ message }}</p>
  <a class="btn btn-primary btn-sm" href="{{ url_for('dashboard') }}">Back to dashboard</a>
</div>
{% endblock %}
