<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreightFlip — {% block title %}{% endblock %}</title>
<style>
  :root {
    --navy:#0f2540; --navy2:#173a63; --orange:#f5820b; --bg:#f4f6f9;
    --card:#ffffff; --line:#e2e8f0; --text:#1e293b; --muted:#64748b;
    --green:#16a34a; --red:#dc2626;
  }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--navy); color:#fff; padding:0.9rem 2rem; display:flex; align-items:center; gap:2rem; }
  .logo { font-size:1.35rem; font-weight:800; letter-spacing:-0.5px; }
  .logo span { color:var(--orange); }
  nav a { color:#cbd5e1; text-decoration:none; margin-right:1.2rem; font-weight:600; font-size:0.95rem; }
  nav a:hover, nav a.active { color:#fff; }
  main { max-width:1100px; margin:2rem auto; padding:0 1.5rem; }
  h1 { font-size:1.6rem; margin-bottom:0.3rem; }
  h2 { font-size:1.15rem; margin:1.6rem 0 0.8rem; }
  .sub { color:var(--muted); margin-bottom:1.5rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1.3rem; margin-bottom:1.2rem; }
  .grid { display:grid; gap:1rem; }
  .grid-2 { grid-template-columns:1fr 1fr; }
  .grid-4 { grid-template-columns:repeat(4,1fr); }
  @media (max-width:760px){ .grid-2,.grid-4{grid-template-columns:1fr;} }
  table { width:100%; border-collapse:collapse; font-size:0.92rem; }
  th { text-align:left; color:var(--muted); font-size:0.78rem; text-transform:uppercase; letter-spacing:0.04em; padding:0.5rem 0.6rem; border-bottom:2px solid var(--line); }
  td { padding:0.6rem; border-bottom:1px solid var(--line); }
  .badge { display:inline-block; padding:0.15rem 0.55rem; border-radius:999px; font-size:0.75rem; font-weight:700; }
  .badge.open, .badge.available { background:#dcfce7; color:var(--green); }
  .badge.booked, .badge.accepted { background:#dbeafe; color:#1d4ed8; }
  .badge.bid_out, .badge.pending { background:#fef3c7; color:#b45309; }
  .badge.declined, .badge.expired, .badge.cancelled { background:#fee2e2; color:var(--red); }
  .badge.bonded { background:#dcfce7; color:var(--green); }
  .badge.unbonded { background:#fee2e2; color:var(--red); }
  .rate { font-weight:800; color:var(--green); }
  form.inline { display:inline; }
  label { display:block; font-size:0.8rem; font-weight:700; color:var(--muted); margin:0.6rem 0 0.2rem; }
  input, select, textarea { width:100%; padding:0.55rem 0.7rem; border:1px solid var(--line); border-radius:8px; font-size:0.95rem; }
  .btn { display:inline-block; border:none; cursor:pointer; border-radius:8px; padding:0.6rem 1.2rem; font-weight:700; font-size:0.95rem; text-decoration:none; }
  .btn-primary { background:var(--orange); color:#fff; }
  .btn-primary:hover { background:#d97008; }
  .btn-dark { background:var(--navy); color:#fff; }
  .btn-green { background:var(--green); color:#fff; padding:0.35rem 0.8rem; font-size:0.85rem; }
  .btn-red { background:#fff; color:var(--red); border:1px solid var(--red); padding:0.35rem 0.8rem; font-size:0.85rem; }
  .flash { background:#dcfce7; border:1px solid #86efac; color:#166534; padding:0.7rem 1rem; border-radius:8px; margin-bottom:1rem; font-weight:600; }
  .stat { text-align:center; }
  .stat .num { font-size:2rem; font-weight:800; color:var(--navy); }
  .stat .lbl { color:var(--muted); font-size:0.85rem; }
  .muted { color:var(--muted); font-size:0.85rem; }
</style>
</head>
<body>
<header>
  <div class="logo">Freight<span>Flip</span></div>
  <nav>
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('driver_dashboard') }}">Driver</a>
    <a href="{{ url_for('broker_dashboard') }}">Broker</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
