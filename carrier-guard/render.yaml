# CarrierGuard on Render. `render.yaml` is a blueprint: connect the repo once
# and this provisions the web service and its database together.
#
# Nothing secret lives here. SECRET_KEY is generated by Render on first deploy;
# DATABASE_URL is injected from the managed instance; API credentials are set
# by hand in the dashboard and marked sync:false so they are never written back
# to the repo.
services:
  - type: web
    name: carrierguard
    runtime: docker
    dockerfilePath: ./carrier-guard/Dockerfile
    dockerContext: ./carrier-guard
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true          # Render generates and stores it
      - key: DATABASE_URL
        fromDatabase:
          name: carrierguard-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "3"
      - key: DB_POOL_MAX
        value: "5"                   # 3 workers x 5 = 15 connections
      - key: CARRIER_STALE_DAYS
        value: "3"
      - key: FMCSA_WEBKEY
        sync: false                  # set in the dashboard, never in git
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false

  # Nightly carrier refresh. Exits non-zero when it cannot reach FMCSA or has
  # no key configured, so a silently dead ingest shows up as a failed job
  # instead of a table of quietly rotting authority data.
  - type: cron
    name: carrierguard-ingest
    runtime: docker
    dockerfilePath: ./carrier-guard/Dockerfile
    dockerContext: ./carrier-guard
    schedule: "0 8 * * *"          # 08:00 UTC — early morning US
    dockerCommand: python ingest.py --stale
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true        # unused by the job; config demands it in prod
      - key: DATABASE_URL
        fromDatabase:
          name: carrierguard-db
          property: connectionString
      - key: DB_POOL_MAX
        value: "2"
      - key: FMCSA_WEBKEY
        sync: false

databases:
  - name: carrierguard-db
    plan: basic-256mb
    postgresMajorVersion: "17"
