# Strategy parameters. Two intraday engines matching the trader's style:
#   momentum_breakout -> 5m/15m, ride expansion out of a coiled range
#   scalp_pullback    -> 1m/2m, buy the first shallow pullback inside a trend
#
# Both are momentum-family: neither ever fades a move. The scalper takes the
# continuation after a micro-retrace; the breakout takes the initial expansion.

strategies:

  momentum_breakout:
    enabled: true
    timeframe_minutes: 5
    # --- regime filter: only trade when the market is actually trending ---
    ema_fast: 9
    ema_slow: 21
    ema_trend: 50           # bias filter; longs only above, shorts only below
    adx_period: 14
    adx_min: 20.0           # below this the market is chop, stand down
    # --- entry: break of the recent range with expansion confirmation ---
    donchian_period: 20     # breakout lookback
    volume_surge_mult: 1.3  # bar volume vs its 20-bar average
    atr_period: 14
    min_atr_pct_of_price: 0.0002   # skip dead-flat tape
    max_atr_pct_of_price: 0.02     # skip news-spike chaos
    # --- exits ---
    stop_atr_mult: 1.5
    target_atr_mult: 3.0    # 2.0R
    trail_after_r: 1.0      # start trailing once +1R
    trail_atr_mult: 2.0
    time_stop_bars: 48      # cut dead trades (48 * 5m = 4 hours)
    breakeven_at_r: 0.75
    # Volatility thresholds are expressed as a fraction of price, and that
    # fraction differs by an order of magnitude across asset classes: index
    # futures run ~0.07% ATR on 5m while EURUSD runs ~0.008%. A single global
    # threshold silently filters out every forex signal, so each class gets
    # its own band. Measured from the instrument set in instruments.yaml.
    asset_class_overrides:
      forex:
        min_atr_pct_of_price: 0.00002
        max_atr_pct_of_price: 0.004
      crypto:
        min_atr_pct_of_price: 0.00015
        max_atr_pct_of_price: 0.03

  scalp_pullback:
    enabled: true
    timeframe_minutes: 1
    ema_fast: 8
    ema_slow: 21
    ema_trend: 50
    adx_period: 14
    adx_min: 22.0
    atr_period: 14
    # --- entry: price pulls back to the fast EMA / VWAP band, then resumes ---
    pullback_max_atr: 1.0   # retrace must stay shallow (momentum, not reversal)
    resume_confirm_ticks: 1 # break of the pullback bar's extreme
    vwap_side_filter: true  # longs only above session VWAP, shorts only below
    rsi_period: 14
    rsi_long_min: 50.0
    rsi_short_max: 50.0
    min_atr_pct_of_price: 0.0001
    max_atr_pct_of_price: 0.01
    # --- exits: scalps are tight and fast ---
    stop_atr_mult: 1.0
    target_atr_mult: 1.5    # 1.5R
    trail_after_r: 0.0      # no trail; scalps take the target
    trail_atr_mult: 0.0
    time_stop_bars: 20      # 20 minutes and out
    breakeven_at_r: 0.5
    asset_class_overrides:
      forex:
        min_atr_pct_of_price: 0.00001
        max_atr_pct_of_price: 0.002
      crypto:
        min_atr_pct_of_price: 0.0001
        max_atr_pct_of_price: 0.02

# Portfolio-level controls applied across whichever strategies are enabled.
portfolio:
  max_concurrent_positions: 3
  max_positions_per_instrument: 1
  max_correlated_positions: 2       # instruments sharing a correlation_group
  correlation_groups:
    equity_index: [MES, MNQ]
    usd_majors: [EURUSD, GBPUSD]
    crypto_beta: [BTCUSDT, ETHUSDT]
  # After this many consecutive losers the bot stops for the session. Prop
  # evals are lost in tilt streaks far more often than in single bad trades.
  max_consecutive_losses: 3
  max_trades_per_day: 12
